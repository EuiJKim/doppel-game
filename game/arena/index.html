<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>도플: 아레나 — 내가 설계하고, 분신이 싸운다</title>
<link rel="stylesheet" href="arena.css">
</head>
<body>

<div class="stage">
  <canvas id="cv" width="900" height="500"></canvas>

  <!-- 전투 HUD -->
  <div class="hud" id="hud">
    <div class="hp-row">
      <div class="hp me"><div class="hp-name">분신</div><div class="hp-bar"><div class="hp-fill me-fill" id="hp-me"></div></div></div>
      <div class="battle-no" id="battle-no">1 / 3</div>
      <div class="hp foe"><div class="hp-name" id="foe-name">불도저</div><div class="hp-bar"><div class="hp-fill foe-fill" id="hp-foe"></div></div></div>
    </div>
    <div class="my-skills" id="my-skills"></div>
  </div>
  <div class="announce" id="announce"></div>

  <!-- 타이틀 -->
  <div class="overlay" id="ov-title">
    <h1>도플: 아레나</h1>
    <p class="sub">스킬은 당신이 고른다. 싸움은 분신이 한다.<br>당신의 선택이 옳았는지는 — 관중석에서 확인하라.</p>
    <button class="big-btn" id="btn-start">런 시작 (3연전)</button>
  </div>

  <!-- 드래프트 -->
  <div class="overlay hidden" id="ov-draft">
    <div class="foe-preview" id="foe-preview"></div>
    <p class="sub draft-title">스킬을 하나 선택하라</p>
    <div class="draft-row" id="draft-row"></div>
    <div class="advice" id="advice"></div>
  </div>

  <!-- 전투 결과 -->
  <div class="overlay hidden" id="ov-result">
    <h1 id="result-title">승리</h1>
    <div class="learn-box" id="battle-notes"></div>
    <button class="big-btn" id="btn-next">다음</button>
  </div>

  <!-- 런 종료 -->
  <div class="overlay hidden" id="ov-runend">
    <h1 id="runend-title">런 클리어</h1>
    <p class="sub" id="runend-stats"></p>
    <button class="big-btn" id="btn-again">다시 도전</button>
  </div>
</div>

<script src="arena.js"></script>
</body>
</html>
