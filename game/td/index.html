<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>회귀한 마왕은 나의 타워를 기억한다</title>
<link rel="stylesheet" href="td.css">
</head>
<body>

<div class="stage">
  <canvas id="cv" width="900" height="520"></canvas>

  <!-- 상단 HUD -->
  <div class="hud-top">
    <span class="stat">💰 <b id="gold">110</b></span>
    <span class="stat">❤ <b id="lives">10</b></span>
    <span class="stat">웨이브 <b id="wave-no">0</b>/10</span>
  </div>

  <!-- 마왕의 선언 배너 -->
  <div class="taunt-banner" id="taunt-banner"></div>
  <div class="announce" id="announce"></div>

  <!-- 타이틀 -->
  <div class="overlay" id="ov-title">
    <h1>회귀한 마왕은<br>나의 타워를 기억한다</h1>
    <p class="sub">마왕은 네 타워를 읽고, 선언하고, 그대로 온다.<br>격퇴해도 — 놈은 기억을 갖고 회귀한다.</p>
    <button class="big-btn" id="btn-start">방어 시작</button>
    <button class="ghost-btn" id="btn-memory">마왕의 회귀록</button>
  </div>

  <!-- 결과 -->
  <div class="overlay hidden" id="ov-end">
    <h1 id="end-title">마왕 격퇴</h1>
    <div class="learn-box" id="end-notes"></div>
    <button class="big-btn" id="btn-again">다음 회차</button>
  </div>

  <!-- 회귀록 -->
  <div class="overlay hidden" id="ov-memory">
    <h1>마왕의 회귀록</h1>
    <p class="sub">놈이 당신에 대해 적은 것 —</p>
    <div class="learn-box" id="memory-lines"></div>
    <button class="big-btn" id="btn-memory-close">닫기</button>
  </div>
</div>

<!-- 하단: 타워 픽커 + 웨이브 시작 -->
<div class="dock">
  <div class="picker" id="picker"></div>
  <button class="wave-btn" id="btn-wave" disabled>웨이브 시작</button>
</div>

<script src="data.js"></script>
<script src="td.js"></script>
</body>
</html>
