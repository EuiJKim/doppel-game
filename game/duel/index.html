<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>도플: 결투 — 죽을수록 나를 아는 검객</title>
<link rel="stylesheet" href="duel.css">
</head>
<body>

<div class="stage">
  <canvas id="cv" width="900" height="520"></canvas>

  <!-- HUD -->
  <div class="hud-top">
    <div class="duel-no" id="duel-no">결투 1 — 그림자</div>
    <div class="enemy-hp"><div class="enemy-hp-fill" id="enemy-hp"></div></div>
    <div class="taunt" id="taunt"></div>
  </div>
  <div class="hearts" id="hearts">♥♥♥</div>
  <div class="announce" id="announce"></div>
  <div class="hint" id="hint"></div>

  <!-- 타이틀 -->
  <div class="overlay" id="ov-title">
    <h1>도플: 결투</h1>
    <p class="sub">당신의 그림자가 당신을 배워, 당신을 베러 온다.<br>이기는 방법은 하나 — 당신 자신을 배신하는 것.</p>
    <div class="howto">
      <div><span class="cue cue-high">상단베기</span> → <b>⚔ 쳐내기</b> <kbd>A</kbd>/<kbd>←</kbd></div>
      <div><span class="cue cue-low">하단베기</span> → <b>⤴ 점프</b> <kbd>S</kbd>/<kbd>↓</kbd></div>
      <div><span class="cue cue-thrust">찌르기</span> → <b>↪ 흘리기</b> <kbd>D</kbd>/<kbd>→</kbd></div>
      <div class="howto-counter">응수 성공 → 빈틈! <b>아무 버튼 = 반격</b> · 마지막 순간 응수 = <b>완벽(2딜)</b></div>
    </div>
    <button class="big-btn" id="btn-start">결투 시작</button>
    <button class="ghost-btn btn-forget">그림자의 기억 지우기</button>
  </div>

  <!-- 인터미션: 놈이 배운 것 -->
  <div class="overlay hidden" id="ov-inter">
    <h1 id="inter-title">결투 1 승리</h1>
    <p class="sub">그림자가 당신에 대해 적은 것 —</p>
    <div class="learn-box" id="inter-lines"></div>
    <button class="big-btn" id="btn-next-duel">다음 결투</button>
  </div>

  <!-- 사망 -->
  <div class="overlay hidden" id="ov-dead">
    <h1 class="dead-title">패배</h1>
    <p class="sub" id="dead-stats"></p>
    <p class="sub">그림자는 죽지 않는다. 그리고 이렇게 적었다 —</p>
    <div class="learn-box" id="dead-lines"></div>
    <button class="big-btn" id="btn-retry">다시 (그림자는 기억한다)</button>
    <button class="ghost-btn btn-forget">그림자의 기억 지우기</button>
  </div>
</div>

<!-- 입력 버튼 (모바일 겸용) -->
<div class="controls">
  <button class="ctl" data-i="0">⚔<span>쳐내기</span></button>
  <button class="ctl" data-i="1">⤴<span>점프</span></button>
  <button class="ctl" data-i="2">↪<span>흘리기</span></button>
</div>

<script src="duel.js"></script>
</body>
</html>
