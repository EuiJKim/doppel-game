<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>도플 DOPPEL — 나를 배우는 분신</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 홈 화면 -->
<section id="screen-home" class="screen active">
  <div class="home-wrap">
    <h1 class="logo">도플<span class="logo-en">DOPPEL</span></h1>
    <p class="tagline">한 장 더 갈까, 여기서 멈출까 —<br>그 선택을 배워, 끝내 나와 마주하는 분신</p>

    <div class="doppel-status">
      <div class="doppel-face" id="doppel-face">◑</div>
      <div class="doppel-info">
        <div class="match-label">분신-나 일치율</div>
        <div class="match-bar"><div class="match-fill" id="match-fill"></div></div>
        <div class="match-pct" id="match-pct">0%</div>
        <div class="learn-count" id="learn-count">배운 판: 0</div>
      </div>
    </div>

    <div class="doppel-quote" id="home-quote">"…누구세요? 아, 제가 배울 사람이구나. 일단 쳐보시죠."</div>

    <div class="menu">
      <button class="btn primary" id="btn-spar">스파링 — 분신에게 보여주기</button>
      <button class="btn" id="btn-notes">분신의 노트</button>
      <button class="btn" id="btn-mirror" disabled>거울전 <span class="lock">🔒 선택 80회 · 일치율 65%</span></button>
    </div>
  </div>
</section>

<!-- 상대 선택 -->
<section id="screen-pick" class="screen">
  <h2 class="screen-title">스파링 상대</h2>
  <div class="pick-list">
    <button class="pick" data-ai="bulldozer">
      <span class="pick-name">불도저</span>
      <span class="pick-desc">멈춤이란 없다. 터질 때까지 간다.</span>
    </button>
    <button class="pick" data-ai="accountant">
      <span class="pick-name">회계사</span>
      <span class="pick-desc">기대값이 음수면 그만. 계산이 곧 용기다.</span>
    </button>
    <button class="pick" data-ai="fox">
      <span class="pick-name">여우</span>
      <span class="pick-desc">점수판을 본다. 지면 달리고, 이기면 잠근다.</span>
    </button>
  </div>
  <button class="btn ghost" id="btn-back-home">← 돌아가기</button>
</section>

<!-- 대전 화면 -->
<section id="screen-game" class="screen">
  <div class="table">
    <div class="opp-zone">
      <div class="opp-name" id="opp-name">불도저</div>
      <div class="score-line">확정 <b id="opp-total">0</b></div>
      <div class="pile" id="opp-pile"></div>
      <div class="speech" id="opp-speech"></div>
    </div>

    <div class="deck-zone">
      <div class="deck-info">남은 카드 <b id="deck-count">20</b> · 폭탄 <b class="bomb-num" id="bomb-count">4</b></div>
      <div class="card back" id="deck-card">?</div>
      <div class="round-info" id="round-info">라운드 1 / 5</div>
      <div class="center-msg" id="center-msg"></div>
    </div>

    <div class="my-zone">
      <div class="pile mine" id="my-pile"></div>
      <div class="score-line">내 확정 <b id="my-total">0</b> · 이번 더미 <b class="pile-num" id="my-pilescore">0</b></div>
      <div class="call-badge" id="call-badge"></div>
      <div class="actions" id="actions"></div>
    </div>
  </div>

  <aside class="doppel-seat">
    <div class="seat-head"><span class="doppel-mini">◑</span> 분신 관전 중</div>
    <div class="call-gauge">
      <div class="call-bar"><div class="call-fill" id="call-fill"></div></div>
      <div class="call-stat" id="call-stat">아직 예측할 만큼 못 봤어요</div>
    </div>
    <div class="seat-log" id="seat-log"></div>
  </aside>
</section>

<!-- 세션 결과 -->
<section id="screen-result" class="screen">
  <h2 class="screen-title" id="result-title">세션 종료</h2>
  <div class="result-box" id="result-box"></div>
  <div class="doppel-quote" id="result-quote"></div>
  <div class="menu">
    <button class="btn primary" id="btn-again">한 번 더</button>
    <button class="btn ghost" id="btn-result-home">홈으로</button>
  </div>
</section>

<!-- 분신의 노트 -->
<section id="screen-notes" class="screen">
  <h2 class="screen-title">분신의 노트 — 당신에 대하여</h2>
  <div class="notes-list" id="notes-list"></div>
  <button class="btn ghost" id="btn-notes-home">← 돌아가기</button>
</section>

<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/doppel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
